<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CampusPulse | Login</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="page-bg app-page">


  <main class="card" aria-labelledby="login-title">
    <h1 id="login-title">CampusPulse Login</h1>
    <p class="subtitle">Enter your credentials to continue.</p>

    <form id="loginForm" novalidate>
      <label for="username">Username</label>
      <input id="username" name="username" type="text" placeholder="Enter username" required />

      <label for="password">Password</label>
      <input id="password" name="password" type="password" placeholder="Enter password" required />

      <label for="mfaCode">MFA code</label>
      <input id="mfaCode" name="mfaCode" inputmode="numeric" autocomplete="one-time-code" placeholder="6-digit code" required />

      <p id="errorMessage" class="error" role="alert" aria-live="polite"></p>

      <button type="submit">Login</button>
    </form>
    <p><a href="signup.html">Create an account</a> | <a href="reset.html">Reset password</a></p>
  </main>

  <script src="script.js"></script>
</body>
</html>
