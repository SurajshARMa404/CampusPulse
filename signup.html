<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>CampusPulse | Sign up</title><link rel="stylesheet" href="styles.css"></head>
<body class="page-bg app-page"><main class="card" aria-labelledby="signup-title"><h1 id="signup-title">Create account</h1><p class="subtitle">Verified CSE student access</p><form id="signupForm" novalidate><label for="signupUsername">Username</label><input id="signupUsername" required autocomplete="username"><label for="signupEmail">Email</label><input id="signupEmail" type="email" required autocomplete="email"><label for="signupPassword">Password</label><input id="signupPassword" type="password" minlength="10" required autocomplete="new-password"><label for="signupYear">Study year</label><select id="signupYear" required><option value="">Select year</option><option value="1">1st year</option><option value="2">2nd year</option><option value="3">3rd year</option><option value="4">4th year</option></select><p id="authMessage" class="error" role="alert" aria-live="polite"></p><button type="submit">Create account</button></form><p><a href="login.html">Back to login</a></p></main><script src="auth.js"></script></body></html>
